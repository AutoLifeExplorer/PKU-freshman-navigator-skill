<!doctype html>
<html lang="zh-CN" data-example-type="resource">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>免费资源解锁面板｜燕园路径签</title>
  <style>
    :root{--mist:#dce6e3;--paper:#f7f8f5;--ink:#17231f;--red:#7c2435;--gold:#d9a928;--blue:#2d6274;--line:#b6c8c2;--muted:#5b6964;--done:#38664c;--shadow:0 18px 45px rgba(23,35,31,.10)}
    *{box-sizing:border-box}body{margin:0;background:var(--mist);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}button,a,input{font:inherit}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.shell{width:min(1120px,calc(100% - 32px));margin:24px auto 48px}.topline{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:14px;color:var(--muted);font:12px/1.4 ui-monospace,monospace}.demo{padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:rgba(247,248,245,.7)}.board{overflow:hidden;background:var(--paper);border-radius:26px;box-shadow:var(--shadow)}.hero{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:30px;padding:34px 38px 30px;background:var(--ink);color:#fff}.eyebrow{margin:0 0 8px;color:#d8c76a;font:700 12px/1.3 ui-monospace,monospace;letter-spacing:.12em}.hero h1{margin:0;font:700 clamp(30px,5vw,58px)/1.06 STSong,"Songti SC",serif;letter-spacing:-.04em}.hero p{margin:14px 0 0;color:#bfd0ca}.progress{align-self:center}.progress strong{display:block;font:700 42px/1 ui-monospace,monospace;color:#fff}.progress span{font-size:13px;color:#bfd0ca}.bar{height:7px;margin-top:12px;border-radius:99px;background:#3c4a45;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s ease}.next{display:grid;grid-template-columns:140px minmax(0,1fr) auto;gap:20px;align-items:center;padding:22px 38px;background:#eef2e5;border-bottom:1px solid var(--line)}.stamp{width:112px;height:112px;border:3px double var(--red);border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--red);font:700 14px/1.25 ui-monospace,monospace;transform:rotate(-4deg)}.next h2{margin:0 0 5px;font:700 26px/1.2 STSong,"Songti SC",serif}.next p{margin:0;color:var(--muted)}.primary{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:0 18px;border-radius:12px;background:var(--red);color:#fff;text-decoration:none;font-weight:700}.unlock{padding:30px 38px}.unlock-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}.unlock-head h2{margin:0;font-size:16px}.unlock-head p{margin:0;color:var(--muted);font-size:13px}.trail{position:relative;display:grid;gap:0}.trail::before{content:"";position:absolute;left:23px;top:24px;bottom:24px;width:3px;background:var(--line)}.item{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:16px;align-items:center;padding:13px 0}.item input{position:relative;z-index:1;appearance:none;width:48px;height:48px;margin:0;border:2px solid var(--blue);border-radius:50%;background:var(--paper);cursor:pointer}.item input:checked{border-color:var(--done);background:var(--done)}.item input:checked::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px}.item h3{margin:0 0 4px;font-size:17px}.item p{margin:0;color:var(--muted);font-size:13px}.label{display:inline-flex;margin-left:7px;padding:3px 7px;border-radius:5px;background:#e4eddd;color:var(--done);font:700 11px/1.2 ui-monospace,monospace;vertical-align:2px}.label.limit{background:#f1e7c4;color:#6a5310}.status{white-space:nowrap;color:var(--blue);font:12px/1.4 ui-monospace,monospace}.more{padding:0 38px 34px}.more details{border-top:1px solid var(--line);padding-top:17px}.more summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}.source{color:var(--muted);font-size:13px}.source a{color:var(--blue)}
    @media(max-width:760px){.shell{width:min(100% - 20px,1120px);margin-top:10px}.board{border-radius:18px}.hero{grid-template-columns:1fr;padding:25px 22px}.hero h1{font-size:38px}.progress{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}.progress .bar{grid-column:1/-1}.next{grid-template-columns:74px 1fr;padding:20px 22px}.stamp{width:70px;height:70px;font-size:10px}.next .primary{grid-column:1/-1}.unlock{padding:24px 22px}.unlock-head{display:block}.unlock-head p{margin-top:5px}.item{grid-template-columns:48px minmax(0,1fr)}.status{grid-column:2}.more{padding:0 22px 24px}}
    @media(max-width:380px){.shell{width:calc(100% - 12px)}.hero h1{font-size:34px}.topline{font-size:11px}.next{grid-template-columns:1fr}.stamp{display:none}.item{gap:11px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="topline"><span>燕园路径签 / 资源</span><span class="demo">演示数据 · 权益以当前页面为准</span></div>
    <main class="board">
      <section class="hero" aria-labelledby="decision">
        <div><p class="eyebrow">现在最值得开通</p><h1 id="decision" data-role="primary-decision">先开通正版软件平台。</h1><p>装 Office 或 MATLAB 时立刻省事，路径最短。</p></div>
        <div class="progress" aria-live="polite"><strong id="count">0 / 5</strong><span>已解锁</span><div class="bar"><i id="bar"></i></div></div>
      </section>

      <section class="next" aria-label="当前行动">
        <div class="stamp">NEXT<br>下一枚章</div>
        <div><h2 id="next-title">正版软件平台</h2><p id="next-copy">统一认证登录 → 选择软件 → 按说明激活</p></div>
        <a class="primary" id="next-link" data-role="primary-action" href="https://software.pku.edu.cn/" target="_blank" rel="noreferrer">现在开通</a>
      </section>

      <section class="unlock">
        <div class="unlock-head"><h2>完成一项，路径自动推进</h2><p>默认只列现在有用的 5 项</p></div>
        <div class="trail">
          <label class="item">
            <input type="checkbox" data-title="正版软件平台" data-copy="统一认证登录 → 选择软件 → 按说明激活" data-url="https://software.pku.edu.cn/">
            <span><h3>正版软件平台 <span class="label">免费</span></h3><p>Office、MATLAB 等；具体授权与设备限制看当前说明。</p></span><span class="status">● 已核实 [1]</span>
          </label>
          <label class="item">
            <input type="checkbox" data-title="图书馆校外访问" data-copy="打开图书馆 → 找到校外访问 → 测试数据库" data-url="https://www.lib.pku.edu.cn/index.htm">
            <span><h3>图书馆校外访问 <span class="label limit">条件免费</span></h3><p>校外查论文；需要在校身份和统一认证。</p></span><span class="status">● 已核实 [2]</span>
          </label>
          <label class="item">
            <input type="checkbox" data-title="校园网与 VPN" data-copy="阅读服务说明 → 完成配置 → 测试访问" data-url="https://its.pku.edu.cn/about_8.jsp">
            <span><h3>校园网与 VPN <span class="label limit">条件免费</span></h3><p>连接校内服务；使用范围以当前网络政策为准。</p></span><span class="status">● 已核实 [3]</span>
          </label>
          <label class="item">
            <input type="checkbox" data-title="空闲教室入口" data-copy="打开教务部 → 找到空闲教室 → 收藏入口" data-url="https://dean.pku.edu.cn/web/student.php">
            <span><h3>空闲教室入口 <span class="label">免费</span></h3><p>临时找自习空间；实时占用需在系统内确认。</p></span><span class="status">● 已核实 [4]</span>
          </label>
          <label class="item">
            <input type="checkbox" data-title="图书馆检索服务" data-copy="搜索课程主题 → 保存检索式 → 测试全文" data-url="https://www.lib.pku.edu.cn/index.htm">
            <span><h3>图书馆检索服务 <span class="label">免费</span></h3><p>找书、论文和数据库；部分资源仅校内身份可用。</p></span><span class="status">● 已核实 [2]</span>
          </label>
        </div>
      </section>

      <section class="more">
        <details>
          <summary>以后需要时再开 + 依据</summary>
          <div class="source">
            <p>把不影响当前任务的资源放在这里，避免“免费资源大全”挤满首屏。</p>
            <p>[1] <a href="https://its.pku.edu.cn/download_software.jsp" target="_blank" rel="noreferrer">正版软件说明</a>　[2] <a href="https://www.lib.pku.edu.cn/index.htm" target="_blank" rel="noreferrer">北京大学图书馆</a>　[3] <a href="https://its.pku.edu.cn/about_8.jsp" target="_blank" rel="noreferrer">网络服务说明</a>　[4] <a href="https://dean.pku.edu.cn/web/student.php" target="_blank" rel="noreferrer">教务部学生服务</a></p>
          </div>
        </details>
        <noscript><p>当前首选：开通正版软件平台。步骤：统一认证登录 → 选择软件 → 按说明激活。</p></noscript>
      </section>
    </main>
  </div>
  <script>
    const checks=[...document.querySelectorAll('input[type="checkbox"]')];
    const count=document.querySelector('#count'),bar=document.querySelector('#bar');
    const title=document.querySelector('#next-title'),copy=document.querySelector('#next-copy'),link=document.querySelector('#next-link');
    function update(){
      const done=checks.filter(item=>item.checked).length;
      count.textContent=`${done} / ${checks.length}`;bar.style.width=`${done/checks.length*100}%`;
      const next=checks.find(item=>!item.checked);
      if(next){title.textContent=next.dataset.title;copy.textContent=next.dataset.copy;link.href=next.dataset.url;link.textContent='现在开通'}
      else{title.textContent='本轮完成';copy.textContent='5 项核心资源已检查';link.removeAttribute('href');link.textContent='全部解锁'}
    }
    checks.forEach(item=>item.addEventListener('change',update));update();
  </script>
</body>
</html>
